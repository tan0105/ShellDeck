name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write
  deployments: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 40

    env:
      npm_config_registry: https://registry.npmjs.org/
      npm_config_disturl: https://nodejs.org/dist
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_CUSTOM_DIR: "v{{ version }}"
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      SHELLDECK_SKIP_ELECTRON_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Normalize npm registry
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p='package-lock.json';fs.writeFileSync(p,fs.readFileSync(p,'utf8').split('https://registry.npmmirror.com').join('https://registry.npmjs.org'))"
          npm config get registry
          npm config get disturl

      - name: Cache Electron runtime
        uses: actions/cache@v4
        with:
          path: D:\electron-dist
          key: electron-win32-x64-45.3.4

      - name: Install dependencies
        run: npm ci

      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          $dist = 'D:\electron-dist'
          if (-not (Test-Path (Join-Path $dist 'electron.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'electron.zip'
            $urls = @(
              'https://github.com/electron/electron/releases/download/v45.3.4/electron-v45.3.4-win32-x64.zip',
              'https://cdn.npmmirror.com/binaries/electron/45.3.4/electron-v45.3.4-win32-x64.zip',
              'https://mirrors.huaweicloud.com/electron/45.3.4/electron-v45.3.4-win32-x64.zip'
            )
            $ok = $false
            foreach ($url in $urls) {
              Write-Host "Downloading Electron: $url"
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              curl.exe -L --fail --retry 1 --connect-timeout 20 --max-time 240 -o $zip $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and ((Get-Item $zip).Length -gt 100MB)) {
                $ok = $true
                break
              }
            }
            if (-not $ok) { throw 'Electron runtime download failed' }
            Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $zip -DestinationPath $dist -Force
          }
          $target = 'node_modules/electron/dist'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $dist '*') -Destination $target -Recurse -Force
          Set-Content -Path 'node_modules/electron/path.txt' -Value 'electron.exe' -NoNewline

      - name: Validate version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Release tag must start with v" }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "package.json version is $packageVersion, but tag is $tag. Run npm version first."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build folder release
        run: npm run dist

      - name: Write signing key
        shell: pwsh
        env:
          RELEASE_KEY_PEM: ${{ secrets.RELEASE_KEY_PEM }}
        run: |
          if (-not $env:RELEASE_KEY_PEM) { throw "RELEASE_KEY_PEM is not configured" }
          $path = Join-Path $env:RUNNER_TEMP 'release-key.pem'
          [IO.File]::WriteAllText($path, $env:RELEASE_KEY_PEM)
          "SHELLDECK_RELEASE_KEY=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate signed manifest
        shell: pwsh
        run: |
          npm run release -- --version $env:VERSION --file release/ShellDeck/runtime/resources/app.asar --url "https://github.com/${{ github.repository }}/releases/latest/download/app.asar" --notes-file release-notes.md

      - name: Create portable zip
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "release/ShellDeck-$env:VERSION-win-x64.zip"
          Compress-Archive -LiteralPath "release/ShellDeck/ShellDeck.exe", "release/ShellDeck/runtime" -DestinationPath $zip -CompressionLevel Optimal -Force
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            $env:PORTABLE_ZIP,
            "release/ShellDeck/runtime/resources/app.asar",
            "release/release.json",
            "release/release.json.sig"
          )
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            gh release upload $tag @assets --clobber
          } else {
            $notes = Get-Content release-notes.md -Raw
            @"
          下载 ShellDeck-$env:VERSION-win-x64.zip，解压后双击 ShellDeck.exe 运行。

          本 Release 同时提供应用内更新资产：app.asar、release.json、release.json.sig。

          $notes
          "@ | Set-Content -Path "release/release-notes-body.md" -Encoding utf8
            gh release create $tag @assets --title "ShellDeck $env:VERSION" --notes-file "release/release-notes-body.md"
          }

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'release-key.pem') -ErrorAction SilentlyContinue

      - name: Cleanup old Actions and deployments
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$env:REPO"
          $runs = Invoke-RestMethod -Headers $headers -Uri "$api/actions/runs?per_page=100"
          foreach ($run in $runs.workflow_runs) {
            if ([string]$run.id -eq [string]$env:CURRENT_RUN) { continue }
            try {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/actions/runs/$($run.id)" | Out-Null
              Write-Host "deleted workflow run $($run.id)"
            } catch {
              Write-Warning "delete workflow run $($run.id) failed: $($_.Exception.Message)"
            }
          }
          $releases = @(Invoke-RestMethod -Headers $headers -Uri "$api/releases?per_page=100")
          $oldReleases = $releases | Sort-Object -Property published_at -Descending | Select-Object -Skip 10
          foreach ($release in $oldReleases) {
            try {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/$($release.id)" | Out-Null
              Write-Host "deleted release $($release.tag_name)"
            } catch {
              Write-Warning "delete release $($release.tag_name) failed: $($_.Exception.Message)"
            }
          }
          $deps = @(Invoke-RestMethod -Headers $headers -Uri "$api/deployments?per_page=100")
          $latestByEnv = @{}
          foreach ($dep in $deps) {
            $envName = [string]$dep.environment
            $created = [datetime]$dep.created_at
            if (-not $latestByEnv.ContainsKey($envName) -or $created -gt $latestByEnv[$envName].created) {
              $latestByEnv[$envName] = @{ id = [string]$dep.id; created = $created }
            }
          }
          $keep = @{}
          foreach ($item in $latestByEnv.Values) { $keep[[string]$item.id] = $true }
          foreach ($dep in $deps) {
            if ($keep.ContainsKey([string]$dep.id)) { continue }
            try {
              $body = @{ state = 'inactive' } | ConvertTo-Json
              Invoke-RestMethod -Method Post -Headers $headers -Uri "$api/deployments/$($dep.id)/statuses" -ContentType 'application/json' -Body $body | Out-Null
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/deployments/$($dep.id)" | Out-Null
              Write-Host "deleted deployment $($dep.id)"
            } catch {
              Write-Warning "delete deployment $($dep.id) failed: $($_.Exception.Message)"
            }
          }
