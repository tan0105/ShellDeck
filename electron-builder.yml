appId: com.shelldeck.desktop
productName: ShellDeck
copyright: ShellDeck
directories:
  output: ../ShellDeck-build
  buildResources: resources
electronDist: node_modules/electron/dist
npmRebuild: false
asar: true
asarUnpack:
  - "**/*.node"
files:
  - dist/**
  - electron/**
  - shared/**
  - package.json
  - "!node_modules/**/build/**"
  - "!node_modules/**/*.ilk"
  - "!node_modules/**/*.lib"
  - "!node_modules/**/*.exp"
  - "!node_modules/**/*.pdb"
  - "!node_modules/**/*.tlog"
  - "!node_modules/**/*.vcxproj"
  - "!node_modules/**/*.vcxproj.filters"
  - "!node_modules/**/*.recipe"
  - "!node_modules/**/*.lastbuildstate"
  - "!node_modules/cpu-features/**"
  - "!node_modules/buildcheck/**"
  - "!node_modules/nan/**"
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/prebuilds/darwin-*"
  - "!node_modules/better-sqlite3/prebuilds/linux*"
  - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
extraResources:
  - from: resources
    to: resources
  - from: electron/update-helper.ps1
    to: update-helper.ps1
win:
  target:
    - target: dir
      arch:
        - x64
  icon: resources/icon.ico
